name: Uptime check

on:
  schedule:
    # GitHub start geplande workflows onregelmatig (in de praktijk vaak pas
    # na een paar uur). Daarom draait elke run zelf ~5,5 uur lang een
    # controle per 5 minuten; deze cron zorgt alleen dat er steeds een
    # volgende run klaarstaat.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      duur:
        description: "Hoe lang blijven controleren (minuten, 0 = één ronde)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sites controleren
        env:
          DURATION_MINUTES: ${{ github.event_name == 'schedule' && '330' || inputs.duur }}
          INTERVAL_SECONDS: "300"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          DATA_REPO: ${{ vars.DATA_REPO }}
        run: scripts/run.sh
